name: Verify portfolio
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blueprint
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: blueprint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U blueprint -d blueprint_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - name: Verify native PostgreSQL adapter in an empty disposable database
        run: npx vitest run apps/api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://blueprint:ci-disposable-password@localhost:5432/blueprint_test
