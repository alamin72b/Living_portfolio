services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blueprint}
    volumes:
      - blueprint_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/db/migrate.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blueprint}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?Set APP_DATABASE_USER}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@db:5432/${POSTGRES_DB:-blueprint}
      OWNER_TOKEN: ${OWNER_TOKEN:?Set OWNER_TOKEN}
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the public HTTPS origin}
      PREVIEW_ORIGINS: ${PREVIEW_ORIGINS:-}
      SWAGGER_ENABLED: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 6s
      retries: 3
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your domain}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  blueprint_data:
  caddy_data:
  caddy_config:
